[bootstrap.packages]
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:jq" = "latest"
"brew:mise" = "latest"
"brew:ripgrep" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:visual-studio-code" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/takeyaqa/dotfiles.git" }
"~/Projects/github.com/takeyaqa/PictRider" = { url = "https://github.com/takeyaqa/PictRider.git" }
"~/Projects/github.com/takeyaqa/feed-buster" = { url = "https://github.com/takeyaqa/feed-buster.git" }
"~/Projects/github.com/takeyaqa/hotel-example-site" = { url = "https://github.com/takeyaqa/hotel-example-site.git" }
"~/Projects/github.com/takeyaqa/pict-cli" = { url = "https://github.com/takeyaqa/pict-cli.git" }
"~/Projects/github.com/takeyaqa/pict-wasm" = { url = "https://github.com/takeyaqa/pict-wasm.git" }
"~/Projects/github.com/takeyaqa/takeyaqa" = { url = "https://github.com/takeyaqa/takeyaqa.git" }
"~/Projects/github.com/takeyaqa/tester-skills" = { url = "https://github.com/takeyaqa/tester-skills.git" }

[dotfiles]
"~/.zshenv" = { mode = "symlink" }
"~/.codex" = { mode = "symlink-each" }
"~/.config/gh" = { mode = "symlink" }
"~/.config/git" = { mode = "symlink" }
"~/.config/mise" = { mode = "symlink" }
"~/.config/npm" = { mode = "symlink" }
"~/.config/zsh" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }

[bootstrap.hooks.post-dotfiles]
run = "source .zshenv"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 43
magnification = false
show_recents = false
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"

[bootstrap.macos.keyboard]
press_and_hold = false
fn_state = true

[bootstrap.macos.trackpad]
tap_to_click = false
three_finger_drag = false

[tools]
go = "latest"
java = "temurin-25"
node = "24"
python = "3.14"
ruby = "4"
rust = "latest"
